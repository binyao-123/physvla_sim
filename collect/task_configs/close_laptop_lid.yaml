task_id: close_laptop_lid
interaction_mode: push

interaction:
  link_prim: /World/generated/link_1
  joint_prim: /World/generated/joints/joint_1
  joint_type: revolute

sampling:
  assets:
    subdir: laptop
    mesh: link_1.obj
    movable_link: link_1
    base_link: link_0
    mesh_origin: [0.129225, 0.622132, 0.611292]
  hinge:
    origin: [0.0, 0.0, 0.0]
    axis: [1.0, 0.0, 0.0]
  num_fps_points: 15
  num_yaw_perturbations: 8
  max_yaw_perturb_deg: 30.0
  approach_offset_m: 0.04
  contact_offset_m: 0.02
  min_hinge_distance_percentile: 0.0
  horizontal_grasp: true
  # mesh FPS 仅 debug_link_contact_probe 使用；主路径 yaml_handle 不依赖 mesh。
  max_contact_link_local_y_m: 0.25
  max_contact_delta_y_from_link_m: 0.15
  use_push_anchor_fallback: true
  use_scene_approach_direction: true
  approach_direction_world: [0.826, -0.051, -0.562]
  min_approach_direction_dot: 0.08
  min_contact_world_x_m: 0.05
  max_contact_world_x_m: 0.95
  min_contact_world_z_m: 0.02
  max_contact_world_z_m: 0.22
  max_contact_dist_from_link_m: 1.2
  push_anchor_dist_m: 0.10
  # Handle = link_1 坐标系下位姿（keyboard 标定，随 DR 由 runtime link_1 pose 变换到 world）。
  # OFFLINE ONLY: inspect_touch_hdf5.py on keyboard HDF5 → copy here. Auto-collect never reads ref HDF5.
  # Calibrated from close_laptop_lid_20260525_163747.hdf5 demo_0 peak touch @ USD joint=15°
  push_contact_offset_link: [-0.17, 0.1265, 0.1534]
  contact_quat_link: [-0.8007, -0.0113, -0.5585, 0.2163]
  # Reference handle at the successful 15° planning pose.
  reference_contact_world: [0.2268, 0.0001, 0.2199]
  push_contact_reference_joint_deg: 15.0
  # EE hold mean from close_laptop_lid_20260527_162257.hdf5 demo_0, frames 212:242
  # with task_registry joint_1 initial position=40.0. Used only when joint_1 != 15°.
  push_contact_joint_fit_deg: 40.0
  push_contact_joint_fit_world: [0.3078, 0.0, 0.1986]
  push_contact_joint_fit_range_deg: [5.0, 40.0]
  # Circle arc samples [joint_deg, x, y, z]. 6° point is from
  # close_laptop_lid_20260527_171533.hdf5 demo_0, frames 244:304.
  push_contact_joint_arc_points:
    - [6.0, 0.1787, 0.0, 0.2098]
    - [15.0, 0.2268, 0.0, 0.2199]
    - [40.0, 0.3078, 0.0, 0.1986]
  # Optional yaw anchors [yaw_deg, contact_world_xyz, contact_quat_world_wxyz].
  # 150/210 are manual keyboard anchors; 180 keeps the original successful trajectory.
  yaw_contact_anchors:
    - [150.0, 0.23017, 0.03735, 0.20914, -0.73201, 0.00419, -0.68128, -0.00152]
    - [180.0, 0.2268, 0.0001, 0.2199, -0.73678, 0.00017, -0.67613, 0.00019]
    - [210.0, 0.24962, -0.07401, 0.21403, -0.72859, -0.00742, -0.68490, 0.00134]

push:
  push_strategy: yaml_handle
  close_ratio: 0.93
  close_sampled_waypoints: 12
  close_auto_flip_hinge_axis: true
  close_expected_delta_dir_world: [1.0, 0.0, -1.0]
  close_step_deg_usd: 1.0
  close_clamp_joints: true
  close_push_ee_step_m: 0.003
  close_ik_substeps: 8
  close_steps_per_waypoint: 48
  close_final_hold_steps: 180
  max_approach_distance_m: 1.5
  approach_steps: 80
  contact_hold_steps: 24
  approach_backoff_m: 0.04
  approach_clearance_z_m: 0.14
